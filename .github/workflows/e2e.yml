name: E2E (Windows, Linux)

# Installs a published release the way a user would (the NSIS installer on Windows; the AppImage
# and the .deb on Ubuntu), then drives the real app through WebDriver (tauri-driver: msedgedriver
# for WebView2, WebKitWebDriver for WebKitGTK) and checks every feature against the Mac app's. See
# e2e/README.md. Screenshots and a pass/fail table are uploaded per OS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to test, e.g. v1.0.4-rc.6"
        required: true
        type: string
      spec:
        description: "Spec file (default: the full parity suite)"
        required: false
        type: string
      windows_run:
        description: "Test the installer from this Release Windows run's artifact instead (run id)"
        required: false
        type: string
      linux_run:
        description: "Test the packages from this Release Linux dry run's artifact instead (run id)"
        required: false
        type: string
      only:
        description: "Run only these jobs (space-separated: windows linux player-video-stall windows-signin); empty = all"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  TAG: ${{ inputs.tag || 'v1.0.4-rc.6' }}
  E2E_SPEC: ${{ inputs.spec || './specs/parity.e2e.mjs' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  windows:
    if: inputs.only == '' || contains(format(' {0} ', inputs.only), ' windows ')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: A sound card (virtual)
        uses: LABSN/sound-ci-helpers@v1

      - name: tauri-driver
        uses: actions/cache@v4
        id: td
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-win-2
      - if: steps.td.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: msedgedriver matching the WebView2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = $null; foreach ($k in $keys) { if (Test-Path $k) { $ver = (Get-ItemProperty $k).pv; break } }
          if (-not $ver) { $ver = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          Write-Host "WebView2 $ver"
          $dir = "$env:RUNNER_TEMP\edgedriver"; New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($u in "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip", "https://msedgedriver.azureedge.net/$ver/edgedriver_win64.zip") {
            try { Invoke-WebRequest $u -OutFile "$dir\d.zip"; break } catch { Write-Host "no $u" }
          }
          Expand-Archive "$dir\d.zip" -DestinationPath $dir -Force
          "NATIVE_DRIVER=$dir\msedgedriver.exe" | Out-File -Append $env:GITHUB_ENV

      - name: Install Spotless (silent NSIS, like a user)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.windows_run }}") {
            gh run download "${{ inputs.windows_run }}" --repo $env:GITHUB_REPOSITORY --pattern 'Spotless-*-windows' --dir "$env:RUNNER_TEMP\art"
            Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\art" -Recurse -Filter Spotless-Setup.exe | Select-Object -First 1).FullName "$env:RUNNER_TEMP\Spotless-Setup.exe"
          } else {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern Spotless-Setup.exe --dir $env:RUNNER_TEMP
          }
          Start-Process "$env:RUNNER_TEMP\Spotless-Setup.exe" -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Spotless", "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter Spotless.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Spotless.exe not found after install" }
          Write-Host "installed: $($exe.FullName)"
          Get-ChildItem $exe.DirectoryName | Format-Table Name, Length
          "SPOTLESS_APP=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Startup check (installed app, no WebDriver)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\e2e-out"; New-Item -ItemType Directory -Force "$out\shots" | Out-Null
          $p = Start-Process $env:SPOTLESS_APP -PassThru
          Start-Sleep 30
          Write-Host "alive after 30 s: $(-not $p.HasExited)  exit code: $($p.ExitCode)"
          Get-CimInstance Win32_Process -Filter "name='msedgewebview2.exe'" | Select-Object -First 2 -ExpandProperty CommandLine
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$out\shots\00-startup-check.png")
          Get-ChildItem $env:APPDATA, $env:LOCALAPPDATA -Recurse -Filter *.log -ErrorAction SilentlyContinue | Where-Object FullName -match 'spotless' | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          Get-WinEvent -LogName Application -MaxEvents 50 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Spotless' } | Format-List TimeCreated, Id, ProviderName, Message
          Stop-Process -Name Spotless -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
      - name: WebView2 DevTools port for the test (policy, like an admin would set it)
        shell: pwsh
        run: |
          $k = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name 'Spotless.exe' -Value '--remote-debugging-port=9222' -PropertyType String -Force | Out-Null
      - name: Run the suite
        working-directory: e2e
        shell: pwsh
        env:
          E2E_OUT: ${{ runner.temp }}\e2e-out
        run: |
          npm install --no-audit --no-fund
          npx wdio run wdio.conf.mjs

      - name: Desktop screenshot
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\e2e-out\shots" | Out-Null
          $bmp.Save("$env:RUNNER_TEMP\e2e-out\shots\zz-desktop.png")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: ${{ runner.temp }}/e2e-out/
          retention-days: 14

  linux:
    if: inputs.only == '' || contains(format(' {0} ', inputs.only), ' linux ')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: [appimage, deb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Desktop session pieces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webkit2gtk-driver xvfb openbox pulseaudio pulseaudio-utils libfuse2t64 \
            dbus-x11 python3-gi xdg-utils desktop-file-utils imagemagick libglib2.0-bin >/dev/null

      - name: tauri-driver
        uses: actions/cache@v4
        id: td
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-linux-2
      - if: steps.td.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: Install Spotless (${{ matrix.format }})
        run: |
          set -euo pipefail
          if [ "${{ matrix.format }}" = appimage ]; then
            mkdir -p "$HOME/Applications"
            if [ -n "${{ inputs.linux_run }}" ]; then
              gh run download "${{ inputs.linux_run }}" --repo "$GITHUB_REPOSITORY" -n linux-packages --dir art
              cp "$(find art -name '*.AppImage' | head -1)" "$HOME/Applications/Spotless.AppImage"
            else
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Spotless.AppImage --dir "$HOME/Applications"
            fi
            chmod +x "$HOME/Applications/Spotless.AppImage"
            echo "SPOTLESS_APP=$HOME/Applications/Spotless.AppImage" >> "$GITHUB_ENV"
          else
            if [ -n "${{ inputs.linux_run }}" ]; then
              gh run download "${{ inputs.linux_run }}" --repo "$GITHUB_REPOSITORY" -n linux-packages --dir art
              cp "$(find art -name '*.deb' | head -1)" "$RUNNER_TEMP/Spotless_amd64.deb"
            else
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Spotless_amd64.deb --dir "$RUNNER_TEMP"
            fi
            sudo apt-get install -y -qq "$RUNNER_TEMP/Spotless_amd64.deb"
            echo "SPOTLESS_APP=$(command -v spotless)" >> "$GITHUB_ENV"
          fi

      - name: Run the suite
        working-directory: e2e
        env:
          E2E_OUT: ${{ runner.temp }}/e2e-out
          TAURI_WEBVIEW_AUTOMATION: "true"
          TAURI_AUTOMATION: "true"
          SPOTLESS_NO_MOVE: "1"
        run: |
          npm install --no-audit --no-fund
          dbus-run-session -- bash scripts/run-linux.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux-${{ matrix.format }}
          path: ${{ runner.temp }}/e2e-out/
          retention-days: 14

  # The player itself, on the platforms where mpv draws the picture: a downloaded episode in video
  # mode whose picture stream dies, then a seek. The sound must play on (video.rs `watch`). Real
  # libmpv, a real H.264 file over a local HTTP server that stops answering mid-file.
  player-video-stall:
    if: inputs.only == '' || contains(format(' {0} ', inputs.only), ' player-video-stall ')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MPV_DEV_URL: https://github.com/fjenn/spotless/releases/download/deps/libmpv-2-x86_64-20260610-git-304426c.7z
      MPV_DEV_SHA256: af708edcdf6ed12ac7b2bb31b4cbeba0bf7d4eef345a715ef5de782c0ddd6671
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-player-${{ matrix.os }}
      - name: libmpv and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmpv-dev ffmpeg >/dev/null
      - name: libmpv and ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $d = "$env:GITHUB_WORKSPACE\.libmpv"; New-Item -ItemType Directory -Force $d | Out-Null
          curl.exe -fsSL --retry 3 -o "$d\mpv-dev.7z" "$env:MPV_DEV_URL"
          if ((Get-FileHash "$d\mpv-dev.7z" -Algorithm SHA256).Hash -ne $env:MPV_DEV_SHA256) { throw "libmpv hash mismatch" }
          7z x "$d\mpv-dev.7z" -o"$d" -y | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Set-Location $d
          $names = & dumpbin /exports libmpv-2.dll | Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          @("EXPORTS") + ($names | ForEach-Object { "    $_" }) | Set-Content -Path mpv.def -Encoding ascii
          & lib /def:mpv.def /name:libmpv-2.dll /out:mpv.lib /machine:x64
          "RUSTFLAGS=-L native=$d" | Out-File -Append $env:GITHUB_ENV
          $d | Out-File -Append $env:GITHUB_PATH
          choco install ffmpeg -y --no-progress | Out-Null
      - name: A real video file (3 min, H.264, no sound)
        shell: bash
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25 -t 180 -c:v libx264 -preset ultrafast -b:v 1M -g 50 -movflags +faststart -an "$RUNNER_TEMP/picture.mp4"
          ls -la "$RUNNER_TEMP/picture.mp4"
          echo "SPOTLESS_TEST_VIDEO=$RUNNER_TEMP/picture.mp4" >> "$GITHUB_ENV"
      - name: The sound plays on when the picture's stream dies
        shell: bash
        run: cargo test -p player --lib a_dead_picture_stream_never_stops_the_sound_after_a_seek -- --nocapture
      # YouTube answers the runner's IP with 403 on /next, so the installed app cannot build a radio
      # here. The same radio code runs on recorded /next responses instead: the parser
      # (tests/fixtures/next_*.json) and the queue/recommendation logic that turns it into a radio.
      - name: Radio logic on recorded YouTube responses (proxy for the runner's 403)
        shell: bash
        run: |
          cargo test -p innertube --lib models::metadata 2>&1 | tail -4
          cargo test -p encore-core --lib radio 2>&1 | tail -6
          echo "### Radio logic on recorded responses ($RUNNER_OS): passed" >> "$GITHUB_STEP_SUMMARY"

  # The sign-in window opened and closed like a user would, no WebDriver or DevTools port involved.
  windows-signin:
    if: inputs.only == '' || contains(format(' {0} ', inputs.only), ' windows-signin ')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Spotless
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.windows_run }}") {
            gh run download "${{ inputs.windows_run }}" --repo $env:GITHUB_REPOSITORY --pattern 'Spotless-*-windows' --dir "$env:RUNNER_TEMP\art"
            Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\art" -Recurse -Filter Spotless-Setup.exe | Select-Object -First 1).FullName "$env:RUNNER_TEMP\Spotless-Setup.exe"
          } else {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern Spotless-Setup.exe --dir $env:RUNNER_TEMP
          }
          Start-Process "$env:RUNNER_TEMP\Spotless-Setup.exe" -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Spotless" -Recurse -Filter Spotless.exe | Select-Object -First 1
          "SPOTLESS_APP=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Sign-in window, opened and closed
        shell: pwsh
        run: ./e2e/scripts/signin-cancel-windows.ps1 -Exe $env:SPOTLESS_APP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows-signin
          path: ${{ runner.temp }}/e2e-out/
