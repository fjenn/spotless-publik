# SPDX-License-Identifier: GPL-3.0-or-later
# publik's sign-in and usage counting for the Spotless publik edition
# (../README.md). Only fjenn/spotless-publik has this folder.
[package]
name = "publik"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
chrono = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }

# Linux: build OpenSSL into the app. A dynamic libssl.so.3 from the Ubuntu build machine is missing
# on newer distributions (Fedora 45 ships a newer OpenSSL), so the .rpm would not start there.
# native-tls still finds each system's certificates through openssl-probe.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
